<style>
/* Ujjivan SFB · Home Loan journey prototype — styles
   Palette approximates Ujjivan SFB's public brand (teal primary, orange accent).
   Swap the values below for the official brand-guide hex codes if they differ. */
:root {
  --t: #00727A;   --td: #004B52;  --tm: #0B8A93;  --tl: #E3F3F3;  --tb: #B7DEE0;
  --o: #F58220;   --od: #C9620A;  --ol: #FEF0E2;  --ob: #F9CB9C;  --og: #FFB066;
  --ink: #0E2A2E; --ink2: #2B4448; --muted: #5E7478; --faint: #95A7AA; --border: #E0E8E9;
  --ok: #12A16B;  --okd: #0B7A50; --okl: #E4F6EE; --okb: #A9E1C7;
  --warn: #B26A00; --warnl: #FFF4DF; --warnb: #F5D49A;
  --err: #C0392B; --errl: #FDECEA;
  --app-bg: #F4F7F7;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: #071C1F; color: var(--ink);
  font-family: 'Nunito Sans', -apple-system, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
button { font-family: inherit; }
.mono { font-family: 'JetBrains Mono', ui-monospace, monospace; }
.disp { font-family: 'Nunito', 'Nunito Sans', sans-serif; font-weight: 800; letter-spacing: -0.01em; }

/* ─── Stage (outside the phone) ─── */
.stage { min-height: 100vh; padding: 40px 32px 72px; display: flex; flex-direction: column; align-items: center; gap: 28px; }
.stage-header { width: 100%; max-width: 1180px; display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; color: #DCECEC; }
.stage-header h1 { font-family: 'Nunito', sans-serif; font-size: 22px; font-weight: 800; margin: 0 0 4px; color: #F4FBFB; letter-spacing: -0.01em; }
.stage-header p { margin: 0; font-size: 13px; color: #8FB1B4; }
.stage-header .meta { font-family: 'JetBrains Mono', monospace; font-size: 11.5px; color: #6E9599; white-space: nowrap; }
.stage-brand { display: flex; align-items: center; gap: 12px; }
.layout { display: flex; gap: 40px; align-items: flex-start; justify-content: center; flex-wrap: wrap; width: 100%; max-width: 1180px; }
.phone-shell { display: flex; flex-direction: column; align-items: center; gap: 12px; }
.phone-label { font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: .18em; text-transform: uppercase; color: #6E9599; }

/* ─── Side console ─── */
.console { width: 360px; display: flex; flex-direction: column; gap: 14px; color: #DCECEC; }
.panel { background: #0C2A2E; border: 1px solid #16403F; border-radius: 16px; padding: 16px; }
.panel h3 { margin: 0 0 10px; font-family: 'Nunito', sans-serif; font-size: 13px; font-weight: 800; color: #F4FBFB; letter-spacing: .01em; display: flex; align-items: center; justify-content: space-between; }
.panel h3 small { font-family: 'JetBrains Mono', monospace; font-weight: 500; font-size: 10.5px; color: #6E9599; }
.stepper { display: flex; flex-direction: column; gap: 4px; }
.stp { display: flex; align-items: center; gap: 10px; padding: 7px 8px; border-radius: 10px; font-size: 12.5px; color: #8FB1B4; cursor: pointer; border: 0; background: transparent; text-align: left; width: 100%; }
.stp:hover { background: #123538; }
.stp .n { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-family: 'JetBrains Mono', monospace; font-size: 10.5px; background: #143A3D; color: #8FB1B4; flex-shrink: 0; }
.stp.done .n { background: var(--t); color: #fff; }
.stp.on { background: #133A3D; color: #fff; font-weight: 700; }
.stp.on .n { background: var(--o); color: #fff; }
.stp .h { margin-left: auto; font-size: 10.5px; color: var(--og); font-weight: 600; }
.scn { width: 100%; background: #071C1F; color: #DCECEC; border: 1px solid #1E4B4D; border-radius: 10px; padding: 9px 10px; font: inherit; font-size: 12.5px; }
.scn-desc { font-size: 11.5px; color: #8FB1B4; margin-top: 8px; line-height: 1.45; }
.log { display: flex; flex-direction: column; gap: 6px; max-height: 330px; overflow-y: auto; scrollbar-width: thin; scrollbar-color: #1E4B4D transparent; }
.log-row { display: flex; gap: 8px; align-items: flex-start; font-size: 11.5px; line-height: 1.4; animation: fadeIn .25s ease; }
.log-row .id { font-family: 'JetBrains Mono', monospace; font-size: 10.5px; color: var(--og); min-width: 46px; padding-top: 1px; }
.log-row .tx { flex: 1; color: #C6DCDD; }
.log-row .oc { font-family: 'JetBrains Mono', monospace; font-size: 9.5px; padding: 2px 6px; border-radius: 6px; flex-shrink: 0; }
.oc.PASS { background: #0F3D2C; color: #6EE0AE; } .oc.FLAG, .oc.SOFT { background: #3D2D0F; color: #F5C46B; }
.oc.REFER { background: #13304F; color: #8CB8F2; } .oc.INFO { background: #173A3D; color: #9CC6C9; }
.log-empty { font-size: 12px; color: #6E9599; }
.kbd-note { font-size: 11px; color: #6E9599; line-height: 1.5; }

/* ─── Android device ─── */
.device { width: 412px; height: 892px; border-radius: 22px; overflow: hidden; background: #fff; border: 8px solid #2A3B3D;
  box-shadow: 0 30px 80px rgba(0,0,0,.45), 0 0 0 1px #3A4D50; display: flex; flex-direction: column; position: relative; }
.sbar { height: 34px; display: flex; align-items: center; justify-content: space-between; padding: 0 18px; font-family: Roboto, system-ui, sans-serif; font-size: 13.5px; color: #10201F; background: #fff; position: relative; flex-shrink: 0; }
.sbar .cam { position: absolute; left: 50%; top: 7px; transform: translateX(-50%); width: 20px; height: 20px; border-radius: 50%; background: #1E2A2B; }
.sbar .ic { display: flex; gap: 4px; align-items: center; }
.navbar { height: 22px; display: flex; align-items: center; justify-content: center; background: #fff; flex-shrink: 0; }
.navbar i { width: 108px; height: 4px; border-radius: 2px; background: #10201F; opacity: .35; }
.chrome { display: flex; align-items: center; gap: 8px; padding: 6px 10px 8px; background: #fff; border-bottom: 1px solid #EEF2F2; flex-shrink: 0; }
.chrome .url { flex: 1; display: flex; align-items: center; gap: 7px; background: #EFF3F3; border-radius: 999px; padding: 7px 12px; font-size: 12.5px; color: #3D5357; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chrome .url b { color: #10201F; font-weight: 600; }
.chrome .tabs { width: 20px; height: 20px; border: 2px solid #3D5357; border-radius: 5px; font-size: 10px; display: grid; place-items: center; font-weight: 700; color: #3D5357; }
.screen { flex: 1; min-height: 0; position: relative; overflow: hidden; }

/* ─── App shell ─── */
.app { height: 100%; display: flex; flex-direction: column; background: var(--app-bg); position: relative; overflow: hidden; animation: subIn .3s cubic-bezier(.2,.85,.25,1); }
.scroll { flex: 1; overflow-y: auto; overflow-x: hidden; scrollbar-width: none; }
.scroll::-webkit-scrollbar { display: none; }
@keyframes fadeIn { from { opacity: 0 } to { opacity: 1 } }
@keyframes subIn { from { transform: translateX(22px); opacity: 0 } to { transform: none; opacity: 1 } }
@keyframes slideUp { from { transform: translateY(100%) } to { transform: none } }
@keyframes spin { to { transform: rotate(360deg) } }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(245,130,32,.55) } 70% { box-shadow: 0 0 0 9px rgba(245,130,32,0) } 100% { box-shadow: 0 0 0 0 rgba(245,130,32,0) } }
@keyframes popin { from { transform: scale(.6); opacity: 0 } to { transform: scale(1); opacity: 1 } }
@keyframes logoswap { from { transform: scale(.82); opacity: .4 } to { transform: scale(1); opacity: 1 } }
@keyframes dot { 0%,100% { opacity: .3; transform: translateY(0) } 50% { opacity: 1; transform: translateY(-5px) } }
@keyframes drop { from { opacity: 0; transform: translateY(-6px) } to { opacity: 1; transform: none } }

/* Brand wordmark */
.wm { display: inline-flex; flex-direction: column; line-height: 1; }
.wm b { font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 19px; color: var(--t); letter-spacing: -.02em; }
.wm small { font-size: 8.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--o); font-weight: 700; margin-top: 3px; }
.wm.light b { color: #fff; } .wm.light small { color: var(--og); }
.umark-spin { animation: spin 2.6s cubic-bezier(.5,0,.5,1) infinite; transform-origin: 50% 50%; }

/* ─── Website (landing + lead form) ─── */
.web-nav { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; background: #fff; border-bottom: 1px solid #EEF2F2; }
.web-nav .r { display: flex; align-items: center; gap: 12px; color: var(--ink2); }
.web-nav .login { font-size: 12px; font-weight: 700; color: var(--t); border: 1.5px solid var(--tb); border-radius: 999px; padding: 6px 12px; }
.web-hero { position: relative; overflow: hidden; padding: 24px 20px 26px; color: #fff; background: linear-gradient(150deg, var(--t) 0%, var(--td) 100%); }
.web-hero::after { content: ''; position: absolute; right: -70px; top: -60px; width: 240px; height: 240px; border-radius: 50%; background: radial-gradient(circle, rgba(245,130,32,.32), transparent 68%); }
.web-hero .crumb { font-size: 11px; opacity: .8; letter-spacing: .04em; position: relative; z-index: 1; }
.web-hero h1 { font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 28px; line-height: 1.12; margin: 10px 0 8px; letter-spacing: -.02em; position: relative; z-index: 1; }
.web-hero h1 em { font-style: normal; color: var(--og); }
.web-hero p { margin: 0; font-size: 13.5px; opacity: .88; line-height: 1.5; position: relative; z-index: 1; }
.hero-stats { display: flex; gap: 8px; margin-top: 18px; position: relative; z-index: 1; }
.hero-stats div { flex: 1; background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.2); border-radius: 12px; padding: 10px; }
.hero-stats b { display: block; font-family: 'Nunito', sans-serif; font-size: 16px; font-weight: 800; }
.hero-stats span { font-size: 10px; opacity: .8; text-transform: uppercase; letter-spacing: .05em; }
.web-card { margin: -14px 14px 14px; position: relative; z-index: 2; background: #fff; border-radius: 18px; padding: 18px 16px; box-shadow: 0 18px 40px -20px rgba(0,75,82,.5); border: 1px solid var(--border); }
.web-card h2 { margin: 0 0 4px; font-family: 'Nunito', sans-serif; font-size: 18px; font-weight: 800; color: var(--ink); }
.web-card .wc-sub { font-size: 12.5px; color: var(--muted); margin-bottom: 14px; line-height: 1.45; }
.web-sec { padding: 4px 18px 10px; }
.web-sec h3 { font-family: 'Nunito', sans-serif; font-size: 15px; font-weight: 800; margin: 10px 0 10px; color: var(--ink); }
.feat { display: flex; gap: 12px; align-items: flex-start; padding: 10px 0; border-top: 1px solid #EEF2F2; }
.feat:first-of-type { border-top: 0; }
.feat .fi { width: 36px; height: 36px; border-radius: 10px; background: var(--tl); color: var(--t); display: grid; place-items: center; flex-shrink: 0; }
.feat b { font-size: 13.5px; color: var(--ink); } .feat p { margin: 2px 0 0; font-size: 12px; color: var(--muted); line-height: 1.4; }
.web-foot { padding: 16px 18px 24px; font-size: 10.5px; color: var(--faint); line-height: 1.5; border-top: 1px solid #EEF2F2; margin-top: 8px; background: #fff; }

/* ─── Flow header ─── */
.flow-header { background: #fff; padding: 12px 16px 12px; border-bottom: 1px solid #EEF2F2; flex-shrink: 0; }
.flow-header .top { display: flex; align-items: center; gap: 12px; margin-bottom: 11px; }
.icon-btn { width: 32px; height: 32px; border-radius: 9px; background: #EEF3F3; color: var(--ink); display: grid; place-items: center; flex-shrink: 0; cursor: pointer; border: 0; }
.flow-header .titles { flex: 1; min-width: 0; }
.flow-header .t { font-family: 'Nunito', sans-serif; font-size: 16px; font-weight: 800; color: var(--ink); letter-spacing: -.01em; }
.flow-header .s { font-size: 11.5px; color: var(--muted); margin-top: 1px; }
.flow-header .stepno { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--faint); flex-shrink: 0; }
.bar { height: 4px; background: #E8EEEE; border-radius: 999px; overflow: hidden; }
.bar .fill { height: 100%; background: linear-gradient(90deg, var(--t), var(--o)); border-radius: 999px; transition: width .45s cubic-bezier(.2,.8,.2,1); }
.flow-body { padding: 18px 16px 10px; }

/* ─── Fields ─── */
.field { margin-bottom: 13px; }
.lab { font-size: 11px; font-weight: 700; color: var(--ink2); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 6px; display: flex; justify-content: space-between; align-items: center; }
.lab .opt { text-transform: none; letter-spacing: 0; font-weight: 600; color: var(--faint); }
.ctrl { background: #fff; border: 1.5px solid var(--border); border-radius: 12px; padding: 0 14px; display: flex; align-items: center; gap: 10px; min-height: 50px; transition: border-color .15s; }
.ctrl:focus-within { border-color: var(--t); box-shadow: 0 0 0 3px rgba(0,114,122,.1); }
.ctrl input, .ctrl select { flex: 1; min-width: 0; border: 0; outline: none; background: transparent; font: inherit; font-size: 15px; font-weight: 600; color: var(--ink); padding: 13px 0; }
.ctrl .pre { font-size: 15px; font-weight: 700; color: var(--muted); }
.ctrl .suf { font-size: 12px; color: var(--muted); font-weight: 600; white-space: nowrap; }
.hint { font-size: 11.5px; color: var(--faint); margin-top: 5px; line-height: 1.4; }
.hint.warn { color: var(--warn); } .hint.ok { color: var(--okd); }
.row2 { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr); gap: 10px; }
.ctrl input { min-width: 0; }
.seg { display: flex; flex-wrap: wrap; gap: 7px; }
.seg button { border: 1.5px solid var(--border); background: #fff; border-radius: 10px; padding: 9px 12px; font-size: 13px; font-weight: 700; color: var(--ink2); cursor: pointer; transition: all .15s; }
.seg button.on { border-color: var(--t); background: var(--tl); color: var(--td); }
.seg button:disabled { opacity: .45; cursor: not-allowed; }
.verified-pill { display: inline-flex; align-items: center; gap: 5px; background: var(--okl); color: var(--okd); border: 1px solid var(--okb); font-size: 10px; font-weight: 800; padding: 4px 8px; border-radius: 999px; text-transform: uppercase; letter-spacing: .05em; white-space: nowrap; }
.link-btn { background: none; border: 0; color: var(--t); font-weight: 800; font-size: 13px; cursor: pointer; padding: 0; }
.suggest { background: #fff; border: 1.5px solid var(--tb); border-radius: 12px; margin-top: 6px; overflow: hidden; animation: drop .2s ease; }
.suggest div { padding: 10px 14px; font-size: 13px; cursor: pointer; display: flex; justify-content: space-between; gap: 8px; }
.suggest div:hover { background: var(--tl); }
.suggest small { color: var(--muted); font-size: 11px; }

/* consent checks */
.consents { display: flex; flex-direction: column; margin-top: 4px; }
.consent-check { display: flex; gap: 11px; padding: 12px 2px; cursor: pointer; border-top: 1px solid #EEF2F2; }
.consent-check:first-child { border-top: 0; }
.cbox { width: 22px; height: 22px; border-radius: 7px; border: 2px solid #C5D2D3; flex-shrink: 0; margin-top: 1px; background: #fff; display: grid; place-items: center; color: #fff; transition: all .15s; }
.cbox.on { background: var(--t); border-color: var(--t); }
.consent-check .ctx { font-size: 12.5px; color: var(--ink2); line-height: 1.45; }
.consent-check .ctx b { color: var(--ink); }
.req { color: var(--err); }
.info-note { display: flex; gap: 10px; align-items: flex-start; background: var(--tl); border: 1px solid var(--tb); border-radius: 12px; padding: 11px 13px; font-size: 12px; color: var(--td); line-height: 1.45; }
.info-note.warn { background: var(--warnl); border-color: var(--warnb); color: #7A4A00; }
.info-note.ok { background: var(--okl); border-color: var(--okb); color: var(--okd); }
.info-note .ni { flex-shrink: 0; margin-top: 1px; }

/* demo fill chip */
.demo-chip { display: inline-flex; align-items: center; gap: 7px; cursor: pointer; padding: 7px 12px; border-radius: 999px; background: var(--ol); border: 1px dashed var(--ob); color: var(--od); font-size: 11.5px; font-weight: 700; }
.demo-chip .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--o); }

/* ─── CTA bar ─── */
.cta-bar { background: #fff; border-top: 1px solid #EEF2F2; padding: 12px 16px 16px; flex-shrink: 0; }
.cta-bar.split { display: flex; align-items: center; gap: 12px; }
.cta-bar .info { flex: 1; min-width: 0; }
.cta-bar .info .k { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: .07em; }
.cta-bar .info .v { font-family: 'Nunito', sans-serif; font-size: 17px; font-weight: 800; color: var(--ink); }
.btn { width: 100%; border: 0; border-radius: 13px; padding: 15px 18px; font-family: 'Nunito', sans-serif; font-size: 15px; font-weight: 800; cursor: pointer; color: #fff;
  background: linear-gradient(135deg, var(--o), var(--od)); box-shadow: 0 12px 26px -12px rgba(201,98,10,.7); display: flex; align-items: center; justify-content: center; gap: 8px; transition: transform .1s; }
.btn:active { transform: scale(.985); }
.btn.teal { background: linear-gradient(135deg, var(--t), var(--td)); box-shadow: 0 12px 26px -12px rgba(0,75,82,.7); }
.btn.off { background: #C9D4D5; box-shadow: none; cursor: not-allowed; }
.btn.compact { width: auto; padding: 14px 22px; }
.btn.ghost { background: #fff; color: var(--ink2); border: 1.5px solid var(--border); box-shadow: none; }
.btn + .btn { margin-top: 9px; }

/* ─── Brand loader (between stages) ─── */
.bloader { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 0 40px; text-align: center; background: linear-gradient(170deg, var(--t), var(--td)); color: #fff; }
.bl-ring { position: relative; width: 130px; height: 130px; display: grid; place-items: center; margin-bottom: 24px; }
.ring-conic { position: absolute; inset: 0; border-radius: 50%; background: conic-gradient(from 0deg, transparent 0deg, rgba(255,176,102,0) 210deg, var(--og) 350deg, var(--og) 360deg);
  -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 4px), #000 calc(100% - 4px)); mask: radial-gradient(farthest-side, transparent calc(100% - 4px), #000 calc(100% - 4px)); animation: spin 1.15s linear infinite; }
.bl-msg { font-size: 14px; font-weight: 700; color: rgba(255,255,255,.9); margin-top: 14px; }
.bl-sub { font-size: 12px; color: rgba(255,255,255,.7); margin-top: 6px; line-height: 1.5; }
.bl-dots { display: flex; gap: 7px; margin-top: 18px; }
.bl-dots span { width: 8px; height: 8px; border-radius: 50%; animation: dot 1.1s ease-in-out infinite; }
.bl-dots span:nth-child(1) { background: #fff; } .bl-dots span:nth-child(2) { background: var(--og); animation-delay: .18s; } .bl-dots span:nth-child(3) { background: rgba(255,255,255,.5); animation-delay: .36s; }

/* ─── Engine (operational transparency) ─── */
.engine { flex: 1; display: flex; flex-direction: column; align-items: center; padding: 40px 26px 22px; text-align: center; background: linear-gradient(180deg, var(--td), var(--t) 60%, var(--td)); color: #fff; overflow: hidden; }
.engine .eyebrow { font-family: 'JetBrains Mono', monospace; font-size: 10.5px; letter-spacing: .2em; opacity: .75; margin-bottom: 4px; }
.engine h2 { font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 20px; margin: 0 0 22px; letter-spacing: -.01em; }
.scan { position: relative; width: 128px; height: 128px; display: grid; place-items: center; margin-bottom: 18px; }
.scan::before { content: ''; position: absolute; inset: 12px; border-radius: 50%; border: 1px dashed rgba(255,255,255,.22); }
.scan-core { width: 84px; height: 84px; border-radius: 50%; background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.18); display: grid; place-items: center; }
.scan-chip { min-width: 58px; height: 40px; padding: 0 8px; border-radius: 11px; display: grid; place-items: center; font-family: 'JetBrains Mono', monospace; font-weight: 600; font-size: 13px; color: #fff; background: var(--o); box-shadow: 0 6px 18px rgba(0,0,0,.3); animation: logoswap .17s ease; }
.e-count { display: flex; align-items: baseline; gap: 7px; justify-content: center; }
.e-count b { font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 28px; }
.e-count span { font-size: 12.5px; opacity: .8; }
.e-cur { font-size: 12.5px; opacity: .85; margin: 2px 0 20px; min-height: 18px; }
.e-stages { width: 100%; display: flex; flex-direction: column; gap: 7px; margin-bottom: 18px; }
.fstage { display: flex; align-items: center; gap: 11px; text-align: left; background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.1); border-radius: 12px; padding: 10px 13px; opacity: .45; transition: all .3s; }
.fstage.active { opacity: 1; background: rgba(255,255,255,.14); border-color: rgba(255,176,102,.5); }
.fstage.done { opacity: .95; }
.fs-dot { width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; background: rgba(255,255,255,.14); flex-shrink: 0; }
.fstage.done .fs-dot { background: var(--o); }
.fs-spin, .mini-spin { width: 13px; height: 13px; border-radius: 50%; border: 2px solid rgba(255,255,255,.3); border-top-color: #fff; animation: spin .7s linear infinite; }
.fs-t { font-family: 'Nunito', sans-serif; font-size: 13px; font-weight: 800; }
.fs-d { font-size: 11px; opacity: .75; margin-top: 1px; }
.e-progress { width: 100%; display: flex; align-items: center; gap: 12px; margin-top: auto; }
.e-bar { flex: 1; height: 6px; background: rgba(255,255,255,.16); border-radius: 999px; overflow: hidden; }
.e-fill { height: 100%; background: linear-gradient(90deg, var(--og), var(--o)); border-radius: 999px; transition: width .1s linear; }
.e-pct { font-family: 'JetBrains Mono', monospace; font-size: 12px; min-width: 38px; text-align: right; }

/* ─── Fetching (stepped) ─── */
.fetching { flex: 1; display: flex; flex-direction: column; align-items: center; padding: 60px 28px 30px; text-align: center; background: linear-gradient(180deg, var(--t), var(--td)); color: #fff; }
.fetching.slate { background: linear-gradient(180deg, #2E4A4E, #12292C); }
.ft-ring { width: 60px; height: 60px; border-radius: 50%; border: 4px solid rgba(255,255,255,.18); border-top-color: var(--og); animation: spin .85s linear infinite; margin-bottom: 22px; }
.fetching h2 { font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 20px; margin: 0 0 6px; }
.ft-sub { font-size: 13px; opacity: .82; margin-bottom: 24px; }
.ft-list { width: 100%; display: flex; flex-direction: column; gap: 9px; }
.ft-row { display: flex; align-items: center; gap: 11px; text-align: left; background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.14); border-radius: 12px; padding: 12px 14px; font-size: 13px; opacity: .5; transition: all .3s; }
.ft-row.done { opacity: 1; background: rgba(255,255,255,.14); }
.ft-row .fr-dot { width: 18px; height: 18px; border-radius: 50%; display: grid; place-items: center; background: rgba(255,255,255,.16); flex-shrink: 0; }
.ft-row.done .fr-dot { background: var(--og); color: var(--td); }
.ft-row .fr-r { margin-left: auto; font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--og); }

/* ─── Parallel lanes ─── */
.lanes { width: 100%; display: grid; grid-template-columns: 1fr 1fr; gap: 9px; margin-top: 4px; }
.lane { text-align: left; background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.12); border-radius: 13px; padding: 11px 12px; transition: all .3s; }
.lane.done { background: rgba(255,255,255,.14); border-color: rgba(255,176,102,.45); }
.lane .lh { display: flex; align-items: center; justify-content: space-between; font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 12.5px; }
.lane .ll { margin-top: 7px; display: flex; flex-direction: column; gap: 4px; }
.lane .li { font-size: 10.8px; display: flex; justify-content: space-between; gap: 6px; opacity: .5; transition: opacity .3s; }
.lane .li.on { opacity: 1; }
.lane .li b { font-family: 'JetBrains Mono', monospace; font-weight: 600; color: var(--og); }
.gate { margin-top: 14px; display: inline-flex; align-items: center; gap: 8px; font-size: 12px; background: rgba(255,255,255,.1); border-radius: 999px; padding: 7px 13px; }

/* ─── Task hub ─── */
.hub-intro { font-size: 13.5px; color: var(--muted); line-height: 1.5; margin: 2px 2px 16px; }
.hub-intro b { color: var(--ink); }
.hub-progress { display: flex; align-items: center; gap: 11px; margin: 0 2px 16px; }
.hub-progress .hp-bar { flex: 1; height: 6px; background: #E5ECEC; border-radius: 999px; overflow: hidden; }
.hub-progress .hp-fill { height: 100%; border-radius: 999px; background: linear-gradient(90deg, var(--t), var(--o)); transition: width .5s cubic-bezier(.2,.8,.2,1); }
.hub-progress .hp-txt { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--faint); white-space: nowrap; }
.task { display: flex; align-items: center; gap: 13px; background: #fff; border: 1.5px solid var(--border); border-radius: 16px; padding: 14px; margin-bottom: 10px; cursor: pointer; transition: border-color .18s, box-shadow .18s, transform .12s; }
.task:not(.done):not(.locked):hover { border-color: var(--tb); box-shadow: 0 6px 18px -10px rgba(0,114,122,.45); }
.task:not(.done):not(.locked):active { transform: scale(.99); }
.task.done { border-color: var(--okb); background: var(--okl); cursor: default; }
.task.locked { opacity: .55; cursor: not-allowed; }
.task.wait { border-color: var(--ob); background: #FFFAF4; }
.tk-ic { width: 46px; height: 46px; border-radius: 13px; display: grid; place-items: center; background: var(--tl); color: var(--t); flex-shrink: 0; }
.task.done .tk-ic { background: var(--ok); color: #fff; }
.task.wait .tk-ic { background: var(--ol); color: var(--od); }
.tk-body { flex: 1; min-width: 0; }
.tk-nm { font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 14.5px; color: var(--ink); display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
.tk-tag { font-size: 9px; font-weight: 800; letter-spacing: .07em; text-transform: uppercase; background: var(--tl); color: var(--t); padding: 2px 6px; border-radius: 5px; }
.tk-tag.or { background: var(--ol); color: var(--od); }
.tk-ds { font-size: 12px; color: var(--muted); margin-top: 2px; line-height: 1.4; }
.tk-done { font-size: 12px; color: var(--okd); font-weight: 700; margin-top: 3px; line-height: 1.35; }
.tk-wait { font-size: 12px; color: var(--od); font-weight: 700; margin-top: 3px; line-height: 1.35; }
.tk-status { flex-shrink: 0; font-size: 12.5px; font-weight: 800; color: var(--t); display: flex; align-items: center; gap: 4px; }
.task.done .tk-status { color: var(--okd); } .task.wait .tk-status { color: var(--od); }
.hub-secure { display: flex; align-items: center; gap: 8px; justify-content: center; font-size: 11px; color: var(--faint); margin: 14px 2px 6px; text-align: center; }
.help-fab { position: absolute; right: 14px; bottom: 92px; z-index: 30; display: flex; align-items: center; gap: 7px; background: #fff; border: 1.5px solid var(--tb); color: var(--t); font-weight: 800; font-size: 12px; padding: 9px 13px; border-radius: 999px; box-shadow: 0 10px 24px -12px rgba(0,75,82,.6); cursor: pointer; }

/* ─── Sub-flow shell ─── */
.sub { height: 100%; display: flex; flex-direction: column; background: var(--app-bg); position: relative; overflow: hidden; animation: subIn .32s cubic-bezier(.2,.85,.25,1); }
.sub-head { background: #fff; padding: 12px 16px 13px; border-bottom: 1px solid #EEF2F2; flex-shrink: 0; }
.sub-head .row1 { display: flex; align-items: center; gap: 12px; }
.sub-head .sh-t { font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 16px; color: var(--ink); }
.sub-head .sh-s { font-size: 11.5px; color: var(--muted); margin-top: 1px; }
.sub-head .sh-brand { margin-left: auto; font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: .1em; color: var(--faint); flex-shrink: 0; }
.sub-pips { display: flex; gap: 5px; margin-top: 13px; padding-left: 44px; }
.sub-pips .pip { height: 4px; flex: 1; border-radius: 999px; background: #E5ECEC; transition: background .35s; }
.sub-pips .pip.done { background: var(--t); } .sub-pips .pip.active { background: var(--o); }
.sub-body { padding: 20px 16px 10px; }
.sub-cta { background: #fff; border-top: 1px solid #EEF2F2; padding: 12px 16px 16px; flex-shrink: 0; }
.sub-lede { margin-bottom: 18px; }
.sl-ic { width: 54px; height: 54px; border-radius: 16px; margin-bottom: 14px; display: grid; place-items: center; background: linear-gradient(135deg, var(--t), var(--td)); color: #fff; }
.sl-ic.or { background: linear-gradient(135deg, var(--o), var(--od)); }
.sl-ic.ok { background: linear-gradient(135deg, var(--okd), var(--ok)); }
.sl-ic.slate { background: linear-gradient(135deg, #3B5559, #17302F); }
.sl-ic.warn { background: linear-gradient(135deg, #E0A030, var(--warn)); }
.sub-lede h2 { font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 21px; color: var(--ink); margin: 0 0 6px; line-height: 1.15; letter-spacing: -.02em; }
.sub-lede p { font-size: 13.5px; color: var(--muted); line-height: 1.5; margin: 0; }
.sub-lede p b { color: var(--ink2); }
.sub-points { display: flex; flex-direction: column; gap: 10px; margin: 16px 0 18px; }
.sub-point { display: flex; gap: 11px; font-size: 13px; color: var(--ink2); line-height: 1.45; }
.sub-point .sp-ic { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; background: var(--tl); color: var(--t); flex-shrink: 0; margin-top: -1px; }
.sub-point.ok .sp-ic { background: var(--okl); color: var(--okd); }
.sub-point b { color: var(--ink); }

/* id / key-value card */
.kv-card { background: #fff; border: 1.5px solid var(--border); border-radius: 14px; padding: 4px 14px; margin-bottom: 14px; }
.kv-card .r { display: flex; justify-content: space-between; align-items: flex-start; gap: 14px; padding: 10px 0; border-top: 1px solid #EEF2F2; font-size: 12.5px; }
.kv-card .r:first-child { border-top: 0; }
.kv-card .k { color: var(--muted); flex-shrink: 0; }
.kv-card .v { font-weight: 700; color: var(--ink); text-align: right; line-height: 1.4; }
.kv-card .v.mono { font-family: 'JetBrains Mono', monospace; font-weight: 600; letter-spacing: .02em; }
.kv-card .v .ok { color: var(--okd); }
.kv-title { font-size: 11px; font-weight: 800; color: var(--muted); text-transform: uppercase; letter-spacing: .07em; margin: 4px 2px 8px; }

/* choice cards */
.choice { display: flex; flex-direction: column; gap: 10px; }
.choice-card { display: flex; align-items: center; gap: 13px; cursor: pointer; background: #fff; border: 1.5px solid var(--border); border-radius: 15px; padding: 14px; transition: border-color .16s, box-shadow .16s; }
.choice-card:hover { border-color: var(--tb); box-shadow: 0 8px 20px -12px rgba(0,114,122,.45); }
.choice-card.sel { border-color: var(--t); background: var(--tl); }
.choice-card .cc-ic { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; background: var(--tl); color: var(--t); flex-shrink: 0; }
.choice-card.or .cc-ic { background: var(--ol); color: var(--od); }
.choice-card .cc-body { flex: 1; min-width: 0; }
.choice-card .cc-t { font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 14.5px; color: var(--ink); }
.choice-card .cc-d { font-size: 12px; color: var(--muted); margin-top: 2px; line-height: 1.4; }
.choice-or { display: flex; align-items: center; gap: 12px; margin: 2px; font-size: 11px; color: var(--faint); font-weight: 700; letter-spacing: .1em; }
.choice-or::before, .choice-or::after { content: ''; flex: 1; height: 1px; background: #E5ECEC; }
.radio { width: 20px; height: 20px; border-radius: 50%; border: 2px solid #C5D2D3; flex-shrink: 0; display: grid; place-items: center; }
.sel .radio { border-color: var(--t); } .sel .radio::after { content: ''; width: 10px; height: 10px; border-radius: 50%; background: var(--t); }
.bank-mark { width: 38px; height: 38px; border-radius: 10px; display: grid; place-items: center; color: #fff; font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 14px; flex-shrink: 0; }

/* OTP */
.otp-sent { font-size: 13px; color: var(--ink2); line-height: 1.5; margin-bottom: 16px; text-align: center; }
.otp-sent b { color: var(--ink); }
.otp-wrap { position: relative; }
.otp-row { display: flex; gap: 9px; justify-content: center; }
.otp-cell { flex: 1; max-width: 50px; height: 54px; border-radius: 13px; border: 1.5px solid var(--border); background: #fff; display: grid; place-items: center; font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 23px; color: var(--ink); transition: border-color .15s, box-shadow .15s; }
.otp-cell.filled { border-color: var(--t); }
.otp-cell.active { border-color: var(--o); box-shadow: 0 0 0 3px rgba(245,130,32,.14); }
.otp-hidden { position: absolute; inset: 0; opacity: 0; border: 0; width: 100%; height: 100%; font-size: 16px; }
.otp-foot { display: flex; justify-content: center; gap: 6px; margin-top: 14px; font-size: 12.5px; color: var(--muted); }
.otp-foot .resend { color: var(--t); font-weight: 800; cursor: pointer; }
.center { display: flex; justify-content: center; margin-top: 14px; }

/* consent panel */
.consent-panel { background: #fff; border: 1.5px solid var(--border); border-radius: 16px; overflow: hidden; margin-bottom: 14px; }
.cp-head { display: flex; align-items: center; gap: 11px; padding: 13px 15px; color: #fff; background: linear-gradient(135deg, var(--t), var(--td)); }
.cp-head.slate { background: linear-gradient(135deg, #3B5559, #17302F); }
.cp-logo { width: 32px; height: 32px; border-radius: 9px; display: grid; place-items: center; background: rgba(255,255,255,.18); border: 1px solid rgba(255,255,255,.25); }
.cp-ht { font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 13.5px; }
.cp-hs { font-size: 10.5px; opacity: .82; margin-top: 1px; }
.cp-row { display: flex; justify-content: space-between; gap: 14px; padding: 11px 15px; border-top: 1px solid #EEF2F2; }
.cp-k { font-size: 11.5px; color: var(--muted); flex-shrink: 0; }
.cp-v { font-size: 12.5px; font-weight: 700; color: var(--ink); text-align: right; line-height: 1.4; }
.foot-note { font-size: 11px; color: var(--faint); line-height: 1.5; margin: 0 2px 14px; text-align: center; }

/* e-KYC card */
.ekyc-card { background: #fff; border: 1.5px solid var(--okb); border-radius: 16px; overflow: hidden; box-shadow: 0 10px 26px -16px rgba(18,161,107,.5); }
.ekyc-head { display: flex; align-items: center; gap: 11px; padding: 13px 15px; background: var(--okl); border-bottom: 1px solid var(--okb); }
.ek-pic { width: 44px; height: 44px; border-radius: 10px; background: linear-gradient(135deg, #8FA7AA, #46605F); color: #fff; display: grid; place-items: center; font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 17px; }
.ek-nm { font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 15px; color: var(--ink); }
.ek-src { font-size: 11px; color: var(--okd); font-weight: 700; margin-top: 2px; display: flex; align-items: center; gap: 5px; }

/* Liveness */
.live-stage { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 26px 24px; position: relative; overflow: hidden; background: radial-gradient(120% 80% at 50% 20%, #17393C, #061416); }
.live-prompt { font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 19px; color: #fff; text-align: center; margin-bottom: 20px; min-height: 26px; }
.live-sub { font-size: 12.5px; color: rgba(255,255,255,.6); text-align: center; margin: -12px 0 20px; }
.live-oval-wrap { position: relative; width: 220px; height: 270px; display: grid; place-items: center; }
.live-oval { position: absolute; inset: 0; border-radius: 50% / 44%; background: linear-gradient(160deg, #2E4B4E, #17302F); overflow: hidden; box-shadow: inset 0 0 40px rgba(0,0,0,.4); }
.live-oval.dim::after { content: ''; position: absolute; inset: 0; background: rgba(0,0,0,.45); }
.live-head { position: absolute; left: 50%; top: 64px; transform: translateX(-50%); width: 96px; height: 110px; border-radius: 48px 48px 44px 44px; background: rgba(160,190,192,.32); }
.live-body { position: absolute; left: 50%; bottom: -10px; transform: translateX(-50%); width: 168px; height: 120px; border-radius: 84px 84px 0 0; background: rgba(160,190,192,.28); }
.live-ring { position: absolute; inset: -6px; border-radius: 50% / 44%; border: 4px solid rgba(255,255,255,.16); }
.live-scanl { position: absolute; left: 6%; right: 6%; height: 3px; background: linear-gradient(90deg, transparent, var(--og), transparent); box-shadow: 0 0 14px 2px rgba(255,176,102,.6); border-radius: 2px; animation: scanl 2.2s ease-in-out infinite; }
@keyframes scanl { 0%,100% { top: 18% } 50% { top: 78% } }
.live-dots { display: flex; gap: 9px; margin-top: 24px; }
.live-dots .ld { width: 9px; height: 9px; border-radius: 50%; background: rgba(255,255,255,.22); transition: all .3s; }
.live-dots .ld.done { background: var(--o); } .live-dots .ld.active { background: #fff; transform: scale(1.25); }
.live-tips { position: absolute; bottom: 20px; left: 20px; right: 20px; display: flex; justify-content: center; gap: 18px; }
.live-tip { font-size: 11px; color: rgba(255,255,255,.6); display: flex; align-items: center; gap: 6px; }

/* success */
.sub-done, .done-wrap { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 34px 28px; background: #fff; }
.ring-ok { width: 86px; height: 86px; border-radius: 50%; display: grid; place-items: center; color: #fff; background: linear-gradient(135deg, var(--okd), var(--ok)); box-shadow: 0 20px 44px -14px rgba(18,161,107,.55); margin-bottom: 18px; animation: popin .4s cubic-bezier(.2,1.3,.4,1); }
.ring-warn { background: linear-gradient(135deg, #E0A030, var(--warn)); box-shadow: 0 20px 44px -14px rgba(178,106,0,.55); }
.sub-done h2, .done-wrap h2 { font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 22px; color: var(--ink); margin: 0 0 8px; letter-spacing: -.02em; }
.sub-done p, .done-wrap p { font-size: 13.5px; color: var(--muted); line-height: 1.5; margin: 0 0 8px; max-width: 300px; }
.sd-chip { display: inline-flex; align-items: center; gap: 7px; margin-top: 6px; background: var(--okl); border: 1px solid var(--okb); color: var(--okd); font-size: 12px; font-weight: 800; padding: 7px 13px; border-radius: 999px; }

/* ─── Offer / sanction hero ─── */
.o2-hero { background: linear-gradient(160deg, var(--t) 0%, var(--td) 100%); color: #fff; padding: 16px 20px 22px; position: relative; overflow: hidden; flex-shrink: 0; }
.o2-hero::after { content: ''; position: absolute; right: -70px; top: -50px; width: 240px; height: 240px; border-radius: 50%; background: radial-gradient(circle, rgba(245,130,32,.3), transparent 68%); pointer-events: none; }
.o2-top { display: flex; align-items: center; justify-content: space-between; position: relative; z-index: 1; }
.o2-back { width: 32px; height: 32px; border-radius: 9px; display: grid; place-items: center; background: rgba(255,255,255,.16); border: 1px solid rgba(255,255,255,.22); cursor: pointer; color: #fff; }
.o2-eyebrow { font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: .22em; opacity: .82; }
.o2-matched { display: inline-flex; align-items: center; gap: 8px; position: relative; z-index: 1; background: rgba(245,130,32,.22); border: 1px solid rgba(255,176,102,.55); color: #FFE2C6; font-size: 11.5px; font-weight: 700; padding: 6px 12px; border-radius: 999px; margin: 18px 0 14px; }
.o2-pulse { width: 7px; height: 7px; border-radius: 50%; background: var(--og); animation: pulse 1.6s infinite; }
.o2-approved { font-size: 13px; font-weight: 700; opacity: .85; position: relative; z-index: 1; }
.o2-amount { font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 46px; line-height: 1; letter-spacing: -.03em; margin: 4px 0; position: relative; z-index: 1; }
.o2-amtlabel { font-size: 12.5px; opacity: .8; position: relative; z-index: 1; }
.o2-meta { display: flex; justify-content: space-between; gap: 10px; margin-top: 14px; padding-top: 13px; border-top: 1px solid rgba(255,255,255,.16); position: relative; z-index: 1; font-size: 12px; }
.o2-meta b { font-family: 'Nunito', sans-serif; font-size: 14px; }
.o2-body { padding: 16px 16px 8px; }
.o2-terms { display: flex; gap: 8px; margin-bottom: 6px; }
.o2-term { flex: 1; background: #fff; border: 1px solid var(--border); border-radius: 14px; padding: 12px 11px; box-shadow: 0 2px 10px rgba(0,114,122,.05); }
.o2-tk { font-size: 10px; color: var(--faint); text-transform: uppercase; letter-spacing: .07em; font-weight: 700; }
.o2-tv { font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 18px; color: var(--td); margin: 5px 0 2px; }
.o2-ts { font-size: 10.5px; color: var(--muted); line-height: 1.25; }
.o2-sec { font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 14px; color: var(--ink); margin: 18px 0 10px; }
.why { background: #fff; border: 1px solid var(--border); border-radius: 14px; overflow: hidden; }
.why summary { cursor: pointer; list-style: none; padding: 12px 14px; font-weight: 800; font-family: 'Nunito', sans-serif; font-size: 13.5px; display: flex; justify-content: space-between; color: var(--ink); }
.why summary::-webkit-details-marker { display: none; }
.why .wb { padding: 0 14px 12px; }
.bens { display: flex; flex-direction: column; gap: 9px; }
.ben { display: flex; align-items: flex-start; gap: 11px; font-size: 13px; color: var(--ink2); font-weight: 600; line-height: 1.4; }
.tick { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; background: var(--okl); color: var(--okd); flex-shrink: 0; }
.tick.or { background: var(--ol); color: var(--od); }

/* doc / upload rows */
.doc-row { display: flex; align-items: center; gap: 12px; background: #fff; border: 1.5px solid var(--border); border-radius: 14px; padding: 12px; margin-bottom: 8px; transition: border-color .2s; }

function Fetching({ title, sub, lines, slate, onDone, hold = 600, step = 700 }) {
  const [i, setI] = useState(0);

    const ts = lines.map((_, k) => setTimeout(() => setI(k + 1), step * (k + 1)));
    ts.push(setTimeout(onDone, step * lines.length + hold));
    return () => ts.forEach(clearTimeout);

  return (
    <div className={'fetching' + (slate ? ' slate' : '')}>

      <h2>{title}</h2>
      <div className="ft-sub">{sub}</div>

        {lines.map((l, k) => {

          return (

              <div className="fr-dot">{k < i ? <Check s={10} /> : k === i ? <div className="mini-spin" /> : null}</div>

/* Engine: makes backend work visible — cycling chips, staged progress, eased percentage */
function Engine({ eyebrow, title, chips, unit, stages, total = 4600, onDone }) {
  const [pct, setPct] = useState(0); const [ci, setCi] = useState(0); const [stage, setStage] = useState(0);
  useEffect(() => {
    const start = Date.now();
    const tick = setInterval(() => {
      const e = Math.min(1, (Date.now() - start) / total);
      setPct(Math.round((1 - Math.pow(1 - e, 2.2)) * 100));
      setStage(Math.min(stages.length - 1, Math.floor(e * stages.length)));
      if (e >= 1) { clearInterval(tick); setTimeout(onDone, 420); }
    }, 40);
    const cyc = setInterval(() => setCi((i) => (i + 1) % chips.length), 150);
    return () => { clearInterval(tick); clearInterval(cyc); };
  }, []);
  const checked = Math.min(chips.length, Math.max(1, Math.round(pct / 100 * chips.length)));
  return (
    <div className="app">
      <div className="engine">
        <div className="eyebrow">{eyebrow}</div>
        <h2>{title}</h2>
        <div className="scan"><div className="ring-conic" /><div className="scan-core"><div className="scan-chip" key={ci}>{chips[ci]}</div></div></div>
        <div className="e-count"><b>{checked}</b><span>/ {chips.length} {unit}</span></div>
        <div className="e-cur">Evaluating <b>{chips[ci]}</b></div>
        <div className="e-stages">
          {stages.map((s, i) => (
            <div key={s.t} className={'fstage' + (i < stage ? ' done' : i === stage ? ' active' : '')}>
              <div className="fs-dot">{i < stage ? <Check s={11} /> : i === stage ? <span className="fs-spin" /> : null}</div>
              <div><div className="fs-t">{s.t}</div>{i === stage && <div className="fs-d">{s.d}</div>}</div>
            </div>
          ))}
        </div>
        <div className="e-progress"><div className="e-bar"><div className="e-fill" style={{ width: pct + '%' }} /></div><div className="e-pct">{pct}%</div></div>
      </div>
    </div>
  );
}

/* Indicative eligibility — conservative on purpose (declared income −10%, rate +0.50%, FOIR grid −5%) */
function Eligibility({ go }) {
  const { data, set } = useJ();
  const price = +data.price || DEAL.price;
  const inc = +data.income || ARJUN.net, emis = +data.emis || 0;
  const self = data.emp && data.emp !== 'Salaried';
  const [dp, setDp] = useState(price - (data.ask || DEAL.ask));
  const [ten, setTen] = useState(data.tenure || 20);
  const capPct = ltvCap(price), minDp = Math.round(price * (1 - capPct));
  const ask = price - dp, m = ten * 12;
  const incH = inc * (self ? 0.75 : 0.9), capFoir = foirCap(incH) - 5;
  const room = Math.max(0, incH * capFoir / 100 - emis);
  const foirLoan = room / emiPerLakh(TERMS.bufferRate, m) * 1e5;
  const elig = Math.floor(Math.min(foirLoan, capPct * price) / 10000) * 10000;
  const fits = ask <= elig;
  const emi = emiFor(ask, TERMS.cardRate, m);
  const foirShown = (emi + emis) / inc * 100;
  return (
    <div className="app">
      <FlowHeader title="Your estimate" sub="Based on what you told us" pct={52} onBack={() => go('lead3')} />
      <div className="scroll"><div className="flow-body">
        <div className="elig-hero">
          <div className="lab2">Estimated eligibility up to</div>
          <div className="big">{lakh(elig)}</div>
          <div className={'fit' + (fits ? '' : ' no')}>{fits ? <Check s={11} /> : <Ic k="info" s={13} />} {fits ? `Your ${lakh(ask)} request fits.` : `Your ${lakh(ask)} request is above the estimate.`}</div>
          <div className="disc">Estimate only, subject to verification — not a sanction or an offer. We haven&rsquo;t checked your credit report yet.</div>
        </div>

        <div className="slider-card">
          <div className="sh"><span>Your down payment</span><b>{inr(dp)} <span style={{ fontSize: 12, color: 'var(--muted)' }}>({Math.round(dp / price * 100)}%)</span></b></div>
          <input className="range" type="range" min={minDp} max={Math.round(price * 0.5)} step={10000} value={dp} onChange={(e) => setDp(+e.target.value)} />
          <div className="hint">{dp <= minDp ? `RBI caps funding at ${capPct * 100}% for homes up to ₹30L — this is the smallest down payment possible.` : 'Slide to see how a bigger down payment changes your loan.'}</div>
        </div>
        <div className="slider-card">
          <div className="sh"><span>Loan amount</span><b>{inr(ask)}</b></div>
          <div className="sh" style={{ marginTop: 8 }}><span>Tenure</span>
            <div className="stepper-ctl"><button onClick={() => setTen(Math.max(5, ten - 1))}>−</button><b className="disp">{ten} yrs</b><button onClick={() => setTen(Math.min(60 - ARJUN.age, ten + 1))}>+</button></div></div>
          <div className="sh" style={{ marginTop: 10 }}><span>Approx. EMI at {TERMS.cardRate}%</span><b>{inr(emi)}</b></div>
          <div className="meter"><i style={{ width: Math.min(100, foirShown / 60 * 100) + '%' }} /></div>
          <div className="hint">EMIs would take <b>{Math.round(foirShown)}%</b> of your take-home{emis ? ', including your current EMI' : ''}.</div>
        </div>
        {!fits && (
          <div className="info-note warn" style={{ marginTop: 14 }}><span className="ni"><Ic k="info" s={16} /></span>
            <span>To fit, try a bigger down payment or a longer tenure — or add an earning co-applicant in the next step.</span></div>
        )}
        <div className="o2-sec">What happens next · about 5 minutes</div>
        <div className="bens">
          {['Verify PAN and Aadhaar (DigiLocker) and take a selfie', 'Approve a one-time read of your salary account via Account Aggregator', 'Get an in-principle sanction on screen'].map((t) => (
            <div className="ben" key={t}><span className="tick"><Check s={11} /></span>{t}</div>
          ))}
        </div>
        <div className="hint" style={{ marginTop: 10 }}>Keep handy: PAN, your Aadhaar-linked mobile and your salary bank&rsquo;s net-banking OTP.</div>
      </div></div>
      <div className="cta-bar"><button className={'btn' + (fits ? '' : ' off')} onClick={() => { if (!fits) return; set({ ask, tenure: ten }); go('kyc'); }}>Verify &amp; get my sanction <Ic k="arrow" s={16} c="#fff" /></button></div>
    </div>
  );
}

      <div className="scroll"><div className="done-wrap" style={{ justifyContent: 'flex-start', paddingTop: 30 }}>
        <div className="ring-ok"><Check s={40} /></div>
        <h2>Congratulations, {ARJUN.first} — it&rsquo;s your home!</h2>
        <p>Your loan has been paid {d.split.length > 1 ? 'to the seller’s lender and the seller' : 'to the seller'} by RTGS.</p>
        <div className="disb-card">
          <div className="dl">Loan disbursed</div><div className="da">{inr(d.sanctioned)}</div>
          {d.split.map((s) => <div className="disb-line" key={s.to}><span>{s.to}</span><b>{inr(s.amt)}</b></div>)}
          <div className="disb-line"><span>UTR</span><b>{TERMS.utr}</b></div>
        </div>
        <div style={{ width: '100%', textAlign: 'left' }}>
          <KV title="Your loan" rows={[['Loan account', TERMS.loanAc, 1], ['EMI', `${inr(d.emi)} from ${TERMS.firstEmi}`], ['Auto-pay', `UMRN ${TERMS.umrn.slice(0, 12)}…`], ['Prepayment', 'Free, anytime']]} />
          <KV title="Your original papers" rows={[['Stored in', `Ujjivan vault · ${TERMS.vault}`], ['Mortgage', 'Deposit of title deeds · CERSAI filed within 30 days'], ['Returned to you', 'Within 30 days of closing the loan']]} />
          <button className="btn teal"><Ic k="download" s={16} c="#fff" /> Welcome kit, schedule &amp; KFS copy</button>
          <button className="btn ghost" onClick={restart}>Restart prototype</button>
        </div>
      </div></div>
    </div>
  );
}

/* ── app.jsx ── */
/* Shell — router, journey state, scenario switcher and BRE console */

const URLS = {
  web: 'home-loans', lead1: 'home-loans/apply', lead2: 'home-loans/apply', lead3: 'home-loans/apply', eligLoad: 'home-loans/apply/eligibility', elig: 'home-loans/apply/eligibility',
};
const urlFor = (s) => URLS[s] || `home-loans/application/${DEAL.appId}`;

/* Data a stage needs when the console jumps straight to it */
const KYC_DONE = { pan: 'ABCPM1234K · name match 100', aadhaar: 'DigiLocker e-KYC · address verified', face: 'Live · match 92', fin: 'CIBIL 762 · salary ₹65,000 verified' };
const PROP_DONE = { docs: '7 documents · OCR classified', seller: 'Identity, ownership & payee verified', valuer: 'Visit done · report submitted' };
function defaultsFor(stage) {
  const d = {};
  if (stage >= 2) Object.assign(d, { ask: DEAL.ask, tenure: DEAL.tenureYrs, lead: true });
  if (stage >= 3) d.kyc = KYC_DONE;
  if (stage >= 5) d.prop = PROP_DONE;
  if (stage >= 7) d.sign = { esign: '8 documents signed', enach: 'e-NACH accepted' };
  return d;
}

// Deep link for demos: index.html#<screen>&<scenario>, e.g. #done&sellerLoan
const HASH = location.hash.slice(1).split('&');
const START = SCREEN_STAGE[HASH[0]] ? HASH[0] : 'web';
const START_SC = SCENARIOS.some((x) => x.id === HASH[1]) ? HASH[1] : 'happy';

function App() {
  const [screen, setScreen] = useState(START);
  const [sc, setSc] = useState(START_SC);
  const [data, setData] = useState(() => ({ ...defaultsFor(SCREEN_STAGE[START]), ...(START_SC === 'valLow' && SCREEN_STAGE[START] >= 5 ? { ask: dealFor('valLow').sanctioned } : {}) }));
  const [logs, setLogs] = useState([]);
  const [key, setKey] = useState(0);
  const logRef = useRef(null);

  const set = (patch) => setData((d) => ({ ...d, ...patch }));
  const log = (id, text, outcome = 'PASS') => setLogs((l) => [...l.filter((x) => x.id !== id), { id, text, outcome }]);
  const go = (s) => setScreen(s);
  const reset = (nextSc = sc) => { setSc(nextSc); setData({}); setLogs([]); setScreen('web'); setKey((k) => k + 1); };
  const jump = (st) => {
    const stage = STAGES.find((x) => x.n === st);
    // valLow at stage 5+ means the counter-offer was already accepted
    setData({ ...defaultsFor(st), ...(sc === 'valLow' && st >= 5 ? { ask: dealFor(sc).sanctioned } : {}) });
    setLogs([{ id: 'JUMP', text: `Jumped to stage ${st} with defaults`, outcome: 'INFO' }]);
    setScreen(stage.start); setKey((k) => k + 1);
  };
  useEffect(() => { if (logRef.current) logRef.current.scrollTop = logRef.current.scrollHeight; }, [logs]);

  const curStage = SCREEN_STAGE[screen] || 1;
  const scObj = SCENARIOS.find((x) => x.id === sc);
  const S = {
    web: <Landing go={go} />, lead1: <Lead1 go={go} />, lead2: <Lead2 go={go} />, lead3: <Lead3 go={go} />,
    eligLoad: <BrandLoader msg="Calculating your eligibility" sub="Using only what you told us — no credit check yet" ms={2300} onDone={() => go('elig')} />,
    elig: <Eligibility go={go} />, kyc: <KycHub go={go} />, uw: <Underwrite go={go} />, ips: <InPrinciple go={go} />,
    prop: <PropHub go={go} />, propEngine: <PropEngine go={go} />, cleared: <Cleared go={go} />,
    final: <FinalOffer go={go} />, sign: <SignHub go={go} />, dcheck: <DCheck go={go} />, reg: <Registration go={go} />,
    done: <Done restart={() => reset()} />,
  };

  return (
    <JourneyCtx.Provider value={{ sc, data, set, log }}>
      <div className="stage">
        <div className="stage-header">
          <div className="stage-brand"><Wordmark light size={34} />
            <div><h1>Home Loan journey prototype</h1><p>Persona: Arjun Mehta, salaried, Nagpur · buyer side, end to end</p></div></div>
          <div className="meta">HL-STP · {DEAL.appId}</div>
        </div>
        <div className="layout">
          <div className="phone-shell">
            <div className="phone-label">Customer · Android</div>
            <AndroidDevice url={urlFor(screen)}><Fragment key={key + screen}>{S[screen]}</Fragment></AndroidDevice>
          </div>
          <div className="console">
            <div className="panel">
              <h3>Scenario <small>{SCENARIOS.findIndex((x) => x.id === sc) + 1} / {SCENARIOS.length}</small></h3>
              <select className="scn" value={sc} onChange={(e) => reset(e.target.value)}>
                {SCENARIOS.map((x) => <option key={x.id} value={x.id}>{x.label}</option>)}
              </select>
              <div className="scn-desc">{scObj.desc}</div>
            </div>
            <div className="panel">
              <h3>Journey stages <small>click to jump</small></h3>
              {STAGES.map((x) => (
                <button key={x.n} className={'stp' + (x.n < curStage ? ' done' : x.n === curStage ? ' on' : '')} onClick={() => jump(x.n)}>
                  <span className="n">{x.n < curStage ? '✓' : x.n}</span>{x.name}{x.human && <span className="h">{x.human}</span>}
                </button>
              ))}
            </div>
            <div className="panel">
              <h3>Rule engine log <small>{logs.length} entries</small></h3>
              <div className="log" ref={logRef}>
                {logs.length === 0 ? <div className="log-empty">Rules fire here as Arjun moves through the journey.</div>
                  : logs.map((l) => <div className="log-row" key={l.id}><span className="id">{l.id}</span><span className="tx">{l.text}</span><span className={'oc ' + l.outcome}>{l.outcome}</span></div>)}
              </div>
            </div>
            <div className="kbd-note">Prototype only. All figures are illustrative and live in <span className="mono">src/data.jsx</span>. OTPs auto-fill with the demo chip. <a href="rulebook/index.html" style={{ color: 'var(--og)' }}>Open the BRE rule book →</a></div>
          </div>
        </div>
      </div>
    </JourneyCtx.Provider>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);

</script>
</body>
</html>
